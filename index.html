<form class="max-w-sm mx-auto">
  <div class="mb-6">

    <input type="text" id="nombre" class="bg-success-soft border border-success-subtle text-fg-success-strong text-sm rounded-base focus:ring-success focus:border-success block w-full px-3 py-2.5 shadow-xs placeholder:text-fg-success-strong" placeholder="Juan Perez">

  </div>
  <div class="mb-6">

  </div>
  <div class="mb-6">
    <label for="email" class="block mb-2.5 text-sm font-medium text-fg-danger-strong">Tu email</label>

<button type="button" onclick="mostrar_datos()" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">Submit</button>
